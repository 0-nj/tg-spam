<script>
(function () {
    var root = document.documentElement, btn = document.getElementById('theme-toggle');
    function stored() { try { return localStorage.getItem('tgspam:theme'); } catch (e) { return null; } }
    function apply(t, save) {
        root.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#eceff3' : '#0e1116');
        if (save) { try { localStorage.setItem('tgspam:theme', t); } catch (e) {} }
        if (btn) {
            var label = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
            btn.setAttribute('aria-label', label);
            btn.title = label;
        }
    }
    apply(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark', false);
    if (btn) btn.addEventListener('click', function () {
        apply(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
    });
    try {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        var follow = function (e) { var s = stored(); if (s !== 'light' && s !== 'dark') apply(e.matches ? 'light' : 'dark', false); };
        if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
    } catch (e) {}
    var path = location.pathname;
    var links = document.querySelectorAll('#navbarContent .navbar-nav .nav-link[href]');
    for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute('href') === path) {
            links[i].classList.add('active');
            links[i].setAttribute('aria-current', 'page');
        }
    }
})();
</script>
